# tracker-host configuration

# Global settings
output_dir: "./output"
poll_interval_sec: 0.5
status_interval_sec: 30.0

# Path to retina-tracker (relative to tracker-host directory)
retina_tracker_path: "../retina-tracker"

# Path to retina-geolocator (relative to tracker-host directory)
retina_geolocator_path: "../retina-geolocator"

# Retry/resilience settings
retry:
  max_attempts: 5              # Retries before considering "extended outage"
  backoff_base_sec: 2          # Exponential backoff base (2s, 4s, 8s, 16s, 32s)
  extended_outage_sec: 60      # Shutdown tracker after this duration of failures
  health_check_interval_sec: 30 # How often to check if downed endpoint is back

# Optional API forwarding (applied to all instances unless overridden)
api_forward:
  enabled: false
  url: ""
  # headers:
  #   Authorization: "Bearer your-token"

# TCP push server
tcp_server:
  enabled: true
  host: "0.0.0.0"
  port: 30050
  token: "shared-secret"
  auto_provision: true
  auto_provision_port_start: 31000
  auto_provision_port_end: 31099    # max 100 auto-provisioned nodes

# Tracker instances - one per detection endpoint
trackers:
  # HTTP-polled node (legacy, explicit opt-in)
  - name: "radar3"
    mode: "http"
    detection_url: "https://radar3.retnode.com/api/detection"
    config_url: "https://radar3.retnode.com/api/config"
    tcp_port: 30012
    geolocator:
      enabled: true
      tcp_port: 31012
    # Optional per-instance overrides:
    # tracker_config: "./custom-tracker-config.yaml"
    # api_forward:
    #   enabled: true
    #   url: "https://other-api.com/tracks"

  # TCP-pushed node (explicit config with overrides)
  - name: "radar4"
    mode: "tcp"
    node_id: "ret7dd2cb0d"
    tcp_port: 30013
    geolocator:
      enabled: true
      tcp_port: 31013
    # tracker_config: "./custom-radar4.yaml"

  # Auto-provisioned nodes need no entry at all
